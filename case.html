<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-case - Case Viewer</title>
    <link rel="stylesheet" href="docs/case-styles.css" />
  </head>
  <body>
    <div class="case-container">
      <div class="case-header">
        <div class="case-title" id="caseTitle">読み込み中...</div>
        <div class="case-subtitle" id="caseSubtitle"></div>
      </div>

      <a href="index.html" class="back-button">← トップページに戻る</a>

      <div id="loading" class="loading">ケースデータを読み込み中...</div>

      <div id="caseOverview" class="case-overview" style="display: none">
        <div
          class="overview-thumbnail"
          id="overviewThumbnail"
          style="position: relative"
        >
          <div class="thumbnail-header">
            <div class="thumbnail-title" id="thumbnailTitle">ケース分析</div>
            <div class="thumbnail-case-id" id="thumbnailCaseId">Case #000</div>
          </div>
          <div class="thumbnail-metrics" id="thumbnailMetrics">
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbViewsStat">-</div>
              <div class="metric-label">表示数</div>
            </div>
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbLikesStat">-</div>
              <div class="metric-label">いいね</div>
            </div>
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbRepostsStat">-</div>
              <div class="metric-label">リポスト</div>
            </div>
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbRepliesStat">-</div>
              <div class="metric-label">返信</div>
            </div>
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbBookmarksStat">-</div>
              <div class="metric-label">ブックマーク</div>
            </div>
            <div class="thumbnail-metric">
              <div class="metric-value" id="thumbControversyStat">-</div>
              <div class="metric-label">論争比率</div>
            </div>
          </div>
          <div class="judgment-section" id="judgmentSection">
            <div class="judgment-title">
              <span>構造的判定</span>
              <span class="promotion-score">
                <span class="promotion-title">
                  <span> - プロモーション度 : </span>
                  <span class="promotion-text" id="promotionText">0%</span>
                </span>
              </span>
              </div>
              <div class="judgment-content">
                <div class="judgment-bar-container">
                  <div
                    class="judgment-bar"
                    id="structuralJudgmentBar"
                    style="width: 0%"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="overview-content">
          <div class="social-actions">
            <button class="social-button x-share" onclick="shareToX()">
              <span>Xで共有</span>
            </button>
            <button class="social-button copy-link" onclick="copyLink()">
              <span>リンクをコピー</span>
            </button>
            <button
              class="social-button save-thumbnail"
              onclick="saveThumbnail()"
            >
              <span>プレビュー保存</span>
            </button>
          </div>
        </div>
      </div>

      <div id="caseContent" class="case-content" style="display: none">
        <div id="markdownContent" class="markdown-content"></div>
      </div>

      <div id="error" class="error" style="display: none">
        <h2>ケースが見つかりませんでした</h2>
        <p>指定されたケースが存在しないか、読み込みエラーが発生しました。</p>
        <a href="index.html">トップページに戻る</a>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/case.js"></script>
  </body>
</html>
