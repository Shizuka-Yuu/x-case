<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-case - Archive Viewer</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content" id="headerContent"></div>
      </header>

      <div class="controls">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="${CONFIG.search.placeholder}"
          />
          <button class="btn" onclick="performSearch()">検索</button>
          <button class="btn" onclick="clearSearch()">クリア</button>
        </div>
        <div class="sort-controls">
          <label for="sortSelect">並び替え:</label>
          <select
            id="sortSelect"
            class="sort-select"
            onchange="sortArchive()"
          ></select>
          <label for="yearFilter">年:</label>
          <select
            id="yearFilter"
            class="sort-select"
            onchange="filterArchive()"
          >
            <option value="">すべて</option>
          </select>
          <label for="monthFilter">月:</label>
          <select
            id="monthFilter"
            class="sort-select"
            onchange="filterArchive()"
          >
            <option value="">すべて</option>
          </select>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="stat-item">
          <div class="stat-number" id="totalCases">0</div>
          <div class="stat-label">総ケース数</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="totalDays">0</div>
          <div class="stat-label">分析日数</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="currentMonth">0</div>
          <div class="stat-label">今月のケース</div>
        </div>
      </div>

      <div id="loading" class="loading">${CONFIG.ui.loadingMessage}</div>

      <div id="archiveGrid" class="archive-grid" style="display: none"></div>

      <div id="noResults" class="no-results" style="display: none">
        <h3>${CONFIG.ui.noResultsMessage}</h3>
        <p>${CONFIG.ui.noResultsSubMessage}</p>
      </div>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/data-utils.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
